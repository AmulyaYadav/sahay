# Development infrastructure. App processes run on the host via `npm run dev:*`.
services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: sahay
      POSTGRES_PASSWORD: sahay_dev
      POSTGRES_DB: sahay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahay"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres_test:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: sahay
      POSTGRES_PASSWORD: sahay_test
      POSTGRES_DB: sahay_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
