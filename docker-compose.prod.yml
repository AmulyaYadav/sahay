# Production stack for a single VPS. Usage:
#   cp .env.example .env.prod   # fill real values (keys, SMS creds, SITE_ADDRESS)
#   docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm migrate
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# See docs/deployment.md for the full procedure, backups, and rollback.
services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sahay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.prod}
      POSTGRES_DB: sahay
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahay"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
    profiles: ["tools"]
    environment: &apienv
      NODE_ENV: production
      DATABASE_URL: postgres://sahay:${POSTGRES_PASSWORD}@postgres:5432/sahay
      REDIS_URL: redis://redis:6379
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?}
      IDENTITY_HMAC_KEY: ${IDENTITY_HMAC_KEY:?}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      PUSH_PROVIDER: ${PUSH_PROVIDER:-expo}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      WEB_ORIGIN: https://${SITE_ADDRESS:?}
    command: ["node", "dist/db/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment: *apienv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment: *apienv
    command: ["node", "dist/worker-main.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddydata:/data
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  caddydata:
